name: Build MotionAI DaVinci

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Validate Lua syntax
        run: luac5.4 -p Scripts/Comp/MotionAI_29YURO.lua

      - name: Check required UI/features
        shell: bash
        run: |
          set -e
          FILE="Scripts/Comp/MotionAI_29YURO.lua"
          grep -q 'Motion AI by 29YURO' "$FILE"
          grep -q 'Fade In' "$FILE"
          grep -q 'REFERENZVIDEO' "$FILE"
          grep -q 'LETZTES MEDIUM ENTFERNEN' "$FILE"
          grep -q 'IN FUSION ERSTELLEN' "$FILE"

      - name: Build install package
        shell: bash
        run: |
          set -e
          OUT="dist/MotionAI-DaVinci-29YURO"
          mkdir -p "$OUT/Scripts/Comp"
          cp Scripts/Comp/MotionAI_29YURO.lua "$OUT/Scripts/Comp/"
          cp README.md "$OUT/"
          cp INSTALL-WINDOWS.txt "$OUT/"
          cp install_windows.bat "$OUT/"
          cd dist
          zip -r MotionAI-DaVinci-29YURO-Windows.zip MotionAI-DaVinci-29YURO

      - name: Upload ready-to-install ZIP
        uses: actions/upload-artifact@v4
        with:
          name: MotionAI-DaVinci-29YURO-Windows
          path: dist/MotionAI-DaVinci-29YURO-Windows.zip
          if-no-files-found: error
